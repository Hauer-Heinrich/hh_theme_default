editor:
  config:
    contentsCss:
      - 'EXT:hh_theme_default/Resources/Public/Css/bundles/main-rte.bundle.css'

    importModules:
      - { module: '@ckeditor/ckeditor5-font', exports: [ 'Font' ] }
      - { module: '@hauerheinrich/hh-ckeditor-font/palette-buttons.js', exports: [ 'FontColorBtn', 'FontBackgroundColorBtn', 'FontFamilyBtn' ] }

    fontSize:
      options:
        - default
        - { title: "size-xlarge (45px)", model: "size-xlarge", view: { name: "span", classes: "font-size-xlarge" } }
        - { title: "size-large (40px)", model: "size-large", view: { name: "span", classes: "font-size-large" } }
        - { title: "size-slarge (32px)", model: "size-slarge", view: { name: "span", classes: "font-size-slarge" } }
        - { title: "size-xmedium (30px)", model: "size-xmedium", view: { name: "span", classes: "font-size-xmedium" } }
        - { title: "size-medium (25px)", model: "size-medium", view: { name: "span", classes: "font-size-medium" } }
        - { title: "size-smedium (20px)", model: "size-smedium", view: { name: "span", classes: "font-size-smedium" } }
        - { title: "size-small (16px)", model: "size-small", view: { name: "span", classes: "font-size-small" } }

    # style:
    #   definitions:
    #     - { name: "letter-spacing-2", element: "span", classes: ["letter-spacing-2"] }
    #     - { name: "letter-spacing-4", element: "span", classes: ["letter-spacing-4"] }

    fontColorBtn:
      colors:
        - { classes: ['color-primary'], label: 'Color primary', color: '#F8F213' }
        - { classes: ['color-secondary'], label: 'Color secondary', color: '#F8F213' }

    fontBackgroundColorBtn:
      colors:
        - { classes: ['background-color-primary'], label: 'Color primary', color: '#F8F213' }
        - { classes: ['background-color-secondary'], label: 'Color secondary', color: '#F8F213' }

    fontFamilyBtn:
      fonts:
        - { classes: ['font-sans'], label: 'Sans-Serif', fontFamily: 'Arial, sans-serif' }
        - { classes: ['font-serif'], label: 'Serif', fontFamily: 'Georgia, serif' }

    alignment:
      options:
        - { name: 'left', className: 'text-left' }
        - { name: 'center', className: 'text-center' }
        - { name: 'right', className: 'text-right' }
        - { name: 'justify', className: 'text-justify' }

### example linkhandler css classes
### Button config and defaults
buttons:
  link:
    relAttribute:
      enabled: false
    properties:
      class:
        allowedClasses: '
          btn btn-default btn-primary,
          btn btn-default btn-secondary,
        '
classes:
  'btn btn-default btn-primary':
    name: "Button default - color-primary"
  'btn btn-default btn-secondary':
    name: "Button default - color-secondary"
