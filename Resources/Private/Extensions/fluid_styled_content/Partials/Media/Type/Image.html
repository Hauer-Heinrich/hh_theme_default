<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:ce="http://typo3.org/ns/TYPO3/CMS/FluidStyledContent/ViewHelpers"
    data-namespace-typo3-fluid="true">

<f:comment>loading and fetchpriority are there for deside if the image is position within the banner-area (hero-image)</f:comment>
<f:variable name="loading"><f:if condition="{data.colPos} != 0">lazy</f:if></f:variable>
<f:variable name="fetchpriority"><f:if condition="{data.colPos} == 0"><f:then>high</f:then><f:else>auto</f:else></f:if></f:variable>
<figure class="image">
    <f:if condition="{file.link}">
        <f:then>
            <f:link.typolink parameter="{file.link}" title="{file.title}">
                <f:render partial="Media/Rendering/Image" arguments="{file: file, dimensions: dimensions, settings: settings, loading: '{loading}', fetchpriority: '{fetchpriority}'}" />
            </f:link.typolink>
        </f:then>
        <f:else>
            <f:if condition="{data.image_zoom}">
                <f:then>
                    <ce:link.clickEnlarge image="{file}" configuration="{settings.media.popup}">
                        <f:render partial="Media/Rendering/Image" arguments="{file: file, dimensions: dimensions, settings: settings, loading: '{loading}', fetchpriority: '{fetchpriority}'}" />
                    </ce:link.clickEnlarge>
                </f:then>
                <f:else>
                    <f:render partial="Media/Rendering/Image" arguments="{file: file, dimensions: dimensions, settings: settings, loading: '{loading}', fetchpriority: '{fetchpriority}'}" />
                </f:else>
            </f:if>
        </f:else>
    </f:if>
    <f:if condition="{file.description}">
        <figcaption class="image-caption">
            {file.description -> f:format.nl2br()}
        </figcaption>
    </f:if>
</figure>

</html>
